<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saluta Ciccio 👋</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 30px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 38px;
            color: white;
        }

        img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            max-width: 80%;
        }

        .contatore {
            font-size: 28px;
            margin: 25px 0;
            color: white;
            font-weight: bold;
        }

        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
        }

        button:hover {
            background: #ff6b81;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #messaggio {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>👋 SALUTA CICCIO!</h1>

    <img src="ciccio.jpeg" alt="Foto di Ciccio">

    <h2>❤️ Manda un saluto a Ciccio!</h2>

    <div class="contatore">
        👋 Saluti ricevuti: <span id="saluti">...</span>
    </div>

    <button id="pulsante" disabled>👋 SALUTA CICCIO</button>

    <p id="messaggio">Caricamento...</p>

    <p>Ogni saluto rende Ciccio più felice ❤️</p>

    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            onSnapshot,
            runTransaction
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD49gmoM48djjH_DuXsiURdN17cFegHoRo",
            authDomain: "saluta-ciccio.firebaseapp.com",
            projectId: "saluta-ciccio",
            storageBucket: "saluta-ciccio.firebasestorage.app",
            messagingSenderId: "66769159613",
            appId: "1:66769159613:web:1820a773ffbb4f1e9bbed4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const contatoreRef = doc(db, "contatori", "ciccio");

        const numeroSaluti = document.getElementById("saluti");
        const pulsante = document.getElementById("pulsante");
        const messaggio = document.getElementById("messaggio");

        let utenteCorrente = null;
        let haSalutato = false;
        let databasePronto = false;
        let invioInCorso = false;

        function aggiornaPulsante() {
            pulsante.disabled =
                !utenteCorrente ||
                haSalutato ||
                !databasePronto ||
                invioInCorso;
        }

        // Mostra il numero totale in tempo reale
        onSnapshot(contatoreRef, (snapshot) => {

            if (snapshot.exists()) {
                numeroSaluti.innerText = snapshot.data().saluti;
                databasePronto = true;
            } else {
                numeroSaluti.innerText = "Non disponibile";
                databasePronto = false;
            }

            aggiornaPulsante();

        }, (errore) => {

            console.error(errore);
            numeroSaluti.innerText = "Errore";
            databasePronto = false;
            messaggio.innerText = "Impossibile leggere il contatore.";
            aggiornaPulsante();

        });

        // Identifica il visitatore in modo anonimo
        onAuthStateChanged(auth, async (utente) => {

            if (!utente) {
                utenteCorrente = null;
                haSalutato = false;
                aggiornaPulsante();

                try {
                    await signInAnonymously(auth);
                } catch (errore) {
                    console.error(errore);
                    messaggio.innerText =
                        "Errore di accesso. Riprova più tardi.";
                }

                return;
            }

            utenteCorrente = utente;
            haSalutato = false;
            aggiornaPulsante();

            try {

                const salutoRef = doc(
                    db,
                    "saluti_utenti",
                    utente.uid
                );

                const saluto = await getDoc(salutoRef);

                // Evita che un controllo vecchio riabiliti
                // il pulsante dopo un cambio di utente.
                if (auth.currentUser?.uid !== utente.uid) return;

                haSalutato = saluto.exists();

                messaggio.innerText = haSalutato
                    ? "❤️ Hai già salutato Ciccio!"
                    : "Puoi mandare il tuo saluto a Ciccio!";

            } catch (errore) {

                console.error(errore);
                haSalutato = true;
                messaggio.innerText =
                    "Impossibile verificare il tuo saluto.";

            }

            aggiornaPulsante();

        });

        // Registra un solo saluto per identità anonima
        pulsante.addEventListener("click", async () => {

            if (
                !utenteCorrente ||
                haSalutato ||
                !databasePronto ||
                invioInCorso
            ) return;

            invioInCorso = true;
            aggiornaPulsante();

            messaggio.innerText = "Invio del saluto...";

            const uid = utenteCorrente.uid;
            const salutoRef = doc(db, "saluti_utenti", uid);

            try {

                await runTransaction(db, async (transaction) => {

                    // Prima tutte le letture
                    const salutoDoc =
                        await transaction.get(salutoRef);

                    const contatoreDoc =
                        await transaction.get(contatoreRef);

                    if (salutoDoc.exists()) {
                        throw new Error("GIA_SALUTATO");
                    }

                    if (!contatoreDoc.exists()) {
                        throw new Error("CONTATORE_NON_TROVATO");
                    }

                    const salutiAttuali =
                        contatoreDoc.data().saluti;

                    // Poi le scritture atomiche
                    transaction.update(contatoreRef, {
                        saluti: salutiAttuali + 1
                    });

                    transaction.set(salutoRef, {
                        salutato: true
                    });

                });

                haSalutato = true;
                messaggio.innerText =
                    "❤️ Hai salutato Ciccio! Grazie!";

            } catch (errore) {

                console.error(errore);

                if (errore.message === "GIA_SALUTATO") {
                    haSalutato = true;
                    messaggio.innerText =
                        "❤️ Hai già salutato Ciccio!";
                } else {
                    messaggio.innerText =
                        "❌ Saluto non inviato. Riprova.";
                }

            } finally {

                invioInCorso = false;
                aggiornaPulsante();

            }

        });

    </script>

</body>
</html>
